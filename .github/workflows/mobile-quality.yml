name: Mobile quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform to build
        type: choice
        required: true
        default: android
        options:
          - android
          - ios
          - both
      android_backend:
        description: Android build backend
        type: choice
        required: true
        default: ssh
        options:
          - ssh
          - github

permissions:
  contents: read

env:
  EXPO_NO_TELEMETRY: '1'

concurrency:
  group: mobile-quality-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.sha || 'checks' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  quality:
    name: TypeScript, lint, tests, Expo Doctor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test -- --ci
      - name: Expo Doctor
        run: npx expo-doctor

  android-build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.platform == 'android' || inputs.platform == 'both')
    name: Android release APK (test signing)
    runs-on: ubuntu-24.04
    needs: quality
    timeout-minutes: 90
    env:
      CI: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        if: inputs.android_backend == 'github'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Java
        if: inputs.android_backend == 'github'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        if: inputs.android_backend == 'github'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build tools
        if: inputs.android_backend == 'github'
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - name: Install locked dependencies
        if: inputs.android_backend == 'github'
        run: npm ci --include=dev
      - name: Generate Android project
        if: inputs.android_backend == 'github'
        run: npx --no-install expo prebuild --platform android --no-install
      - name: Build Android with isolated JVM lifecycle
        if: inputs.android_backend == 'github'
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleRelease
      - name: Collect GitHub runner APK
        if: inputs.android_backend == 'github'
        run: |
          mkdir -p build/android
          cp android/app/build/outputs/apk/release/app-release.apk build/android/app-release.apk
      - name: Build Android over SSH and retrieve APK
        if: inputs.android_backend == 'ssh'
        env:
          BUILD_HOST: ${{ secrets.TEAR_BUILD_HOST }}
          BUILD_SSH_KEY: ${{ secrets.TEAR_BUILD_SSH_KEY }}
          BUILD_KNOWN_HOSTS: ${{ secrets.TEAR_BUILD_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          : "${BUILD_HOST:?Missing TEAR_BUILD_HOST}" "${BUILD_SSH_KEY:?Missing TEAR_BUILD_SSH_KEY}" "${BUILD_KNOWN_HOSTS:?Missing TEAR_BUILD_KNOWN_HOSTS}"
          umask 077
          key=$(mktemp "$RUNNER_TEMP/tear-key.XXXXXX")
          hosts=$(mktemp "$RUNNER_TEMP/tear-hosts.XXXXXX")
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$BUILD_SSH_KEY" > "$key"
          printf '%s\n' "$BUILD_KNOWN_HOSTS" > "$hosts"
          unset BUILD_SSH_KEY BUILD_KNOWN_HOSTS
          options=(-T -i "$key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts" -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=6)
          ssh "${options[@]}" "tear-build@$BUILD_HOST" "build $GITHUB_SHA"
          mkdir -p build/android
          ssh "${options[@]}" "tear-build@$BUILD_HOST" "artifact $GITHUB_SHA" > build/android/app-release.apk.part
          test -s build/android/app-release.apk.part
          mv build/android/app-release.apk.part build/android/app-release.apk
      - name: Include third-party notices
        run: cat docs/third-party-notices/*.txt > build/android/THIRD_PARTY_NOTICES.txt
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: tear-android-${{ github.sha }}
          path: |
            build/android/*.apk
            build/android/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
          retention-days: 14

  ios-build:
    if: github.event_name == 'workflow_dispatch' && (inputs.platform == 'ios' || inputs.platform == 'both')
    name: iOS Release simulator build
    runs-on: macos-26
    needs: quality
    timeout-minutes: 45
    env:
      CI: '1'
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check Xcode
        run: xcodebuild -version
      - name: Install locked dependencies
        run: npm ci --include=dev
      - name: Generate iOS project
        run: npx --no-install expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install
      - name: Build unsigned iOS simulator app
        run: |
          xcodebuild \
            -workspace ios/TEAr.xcworkspace \
            -scheme TEAr \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Archive simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/Build/Products/Release-iphonesimulator/TEAr.app build/tear-ios-simulator.zip
      - name: Include third-party notices
        run: cat docs/third-party-notices/*.txt > build/THIRD_PARTY_NOTICES.txt
      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: tear-ios-simulator-${{ github.sha }}
          path: |
            build/tear-ios-simulator.zip
            build/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
          retention-days: 14
