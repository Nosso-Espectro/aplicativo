name: Mobile quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform to build
        type: choice
        required: true
        default: android
        options:
          - android
          - ios
          - both

permissions:
  contents: read

env:
  EXPO_NO_TELEMETRY: '1'

concurrency:
  group: mobile-quality-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.sha || 'checks' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  quality:
    name: TypeScript, lint, tests, Expo Doctor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test -- --ci
      - name: Expo Doctor
        run: npx expo-doctor

  android-build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.platform == 'android' || inputs.platform == 'both')
    name: Android release APK (test signing)
    runs-on: ubuntu-24.04
    needs: quality
    timeout-minutes: 90
    env:
      CI: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - name: Install locked dependencies
        run: npm ci --include=dev
      - name: Generate Android project
        run: npx --no-install expo prebuild --platform android --no-install
      - name: Build Android with isolated JVM lifecycle
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleRelease
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: tear-android-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  ios-build:
    if: github.event_name == 'workflow_dispatch' && (inputs.platform == 'ios' || inputs.platform == 'both')
    name: iOS Release simulator build
    runs-on: macos-26
    needs: quality
    timeout-minutes: 45
    env:
      CI: '1'
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check Xcode
        run: xcodebuild -version
      - name: Install locked dependencies
        run: npm ci --include=dev
      - name: Generate iOS project
        run: npx --no-install expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install
      - name: Build unsigned iOS simulator app
        run: |
          xcodebuild \
            -workspace ios/TEAr.xcworkspace \
            -scheme TEAr \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Archive simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/Build/Products/Release-iphonesimulator/TEAr.app build/tear-ios-simulator.zip
      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: tear-ios-simulator-${{ github.sha }}
          path: build/tear-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14
